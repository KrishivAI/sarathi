[package]
name = "sarathi-context"
description = "Context management: the deterministic overflow fallback, compaction seeds and the tool-output spill store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["fs"]
# The file spill store, next to the JSONL session logs. Off, the crate has the in-memory spill store only.
fs = ["dep:tokio"]

[dependencies]
sarathi-log.workspace = true
sarathi-protocol.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true, features = ["rt"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }

[lints]
workspace = true

[[test]]
name = "context"
path = "tests/context.rs"
required-features = ["fs"]
