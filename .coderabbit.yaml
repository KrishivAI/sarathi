# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit review settings. Reviews are advisory: required checks and
# maintainer approval remain the merge gate.
language: en-US
tone_instructions: "Be concise and technical. Flag correctness, safety and provider byte-exactness issues first; skip style nits that rustfmt or clippy already enforce."
early_access: false
reviews:
  # Assertive: more findings per review.
  profile: assertive
  request_changes_workflow: false
  # Keep PR descriptions as written by the author.
  high_level_summary: false
  high_level_summary_in_walkthrough: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  sequence_diagrams: false
  changed_files_summary: true
  suggested_labels: false
  suggested_reviewers: false
  path_filters:
    - "!**/Cargo.lock"
    - "!**/fixtures/**"
    - "!**/cassettes/**"
    - "!**/*.snap"
  path_instructions:
    - path: "crates/**/*.rs"
      instructions: >-
        Library code must not unwrap, expect or panic; errors use thiserror. Lint suppressions use
        #[expect] with a reason, never #[allow]. No unsafe outside sarathi-py. Flag: any parse-and-reserialise
        of provider bytes that the log must store as received (immutable prefix); a side-effecting tool started
        before its start mark is on disk (crash rule); an on-disk format change without a version bump and an N-1
        fixture; unbounded buffers or fan-out proportional to model or tool output; results that depend on hash
        order or wall-clock time; a live model call reachable from a test.
    - path: "**/tests/**"
      instructions: >-
        Tests must assert exact expected values, not just success; flag tests that would pass without the fix,
        wall-clock-sensitive assertions, shared temp paths, and any test that can make a live model call.
    - path: ".github/workflows/**"
      instructions: >-
        Third-party actions must be pinned by full commit SHA; jobs use least-privilege permissions and
        GitHub-hosted runners only.
    - path: "**/*.md"
      instructions: >-
        Report only correctness, security, licence and reproducibility issues. Do not comment on style.
  auto_review:
    enabled: true
    drafts: false
    base_branches: ["main"]
    # Review quota is limited: every reviewed push counts. Only a PR with the `coderabbit` label is reviewed
    # automatically; add the label once, then comment `@coderabbitai review` once per round. Later pushes are not
    # reviewed on their own, and automatic reviews pause after the first reviewed commit.
    labels: ["coderabbit"]
    auto_incremental_review: false
    auto_pause_after_reviewed_commits: 1
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
  tools:
    # Already enforced in CI; avoid duplicate comments.
    clippy:
      enabled: false
    actionlint:
      enabled: false
    markdownlint:
      enabled: false
chat:
  auto_reply: true
knowledge_base:
  learnings:
    scope: local
