# cargo-deny policy. Run: `cargo deny check`. Licences, advisories, bans.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "0BSD",
]
confidence-threshold = 0.9
# webpki-root-certs (CDLA-Permissive-2.0, Mozilla's root store as data) is reached through reqwest's rustls
# platform verifier (sarathi-provider).
exceptions = [{ crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true # workspace path dependencies

deny = [
    { crate = "openssl", reason = "rustls only" },
    { crate = "openssl-sys", reason = "rustls only" },
    { crate = "native-tls", reason = "rustls only" },
    { crate = "anyhow", reason = "libraries use thiserror" },
    { crate = "async-std", reason = "tokio only" },
    # Rig's design is borrowed, not its code.
    { crate = "rig-core", reason = "design borrowed, never a dependency" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
