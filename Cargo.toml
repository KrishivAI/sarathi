[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# MSRV: CI builds at 1.94 as well as the pinned toolchain (rust-toolchain.toml).
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/KrishivAI/sarathi"
publish = false

# Dependencies: one table, `default-features = false`, exact pins for HTTP and MCP crates.
[workspace.dependencies]
sarathi-protocol = { path = "crates/sarathi-protocol" }
sarathi-provider = { path = "crates/sarathi-provider" }
sarathi-tools = { path = "crates/sarathi-tools" }
async-stream = { version = "=0.3.6", default-features = false }
bytes = { version = "1.12", default-features = false, features = ["std"] }
futures = { version = "0.3.34", default-features = false, features = ["std"] }
# HTTP: exact pin, rustls only (no OpenSSL), redirects not followed (the client sets the policy).
reqwest = { version = "=0.13.5", default-features = false, features = ["stream", "rustls"] }
sarathi-log = { path = "crates/sarathi-log" }
sarathi-context = { path = "crates/sarathi-context" }
sarathi-core = { path = "crates/sarathi-core" }
sha2 = { version = "0.11", default-features = false }
uuid = { version = "1.28", default-features = false, features = ["std"] }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
thiserror = { version = "2.0.21", default-features = false, features = ["std"] }
tokio = { version = "1.53", default-features = false }
# Tests only.
proptest = { version = "1.9", default-features = false, features = ["std"] }
tempfile = { version = "3.27", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
# Lint exceptions are `#[expect(lint, reason = "...")]`, never a bare `#[allow]`.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
