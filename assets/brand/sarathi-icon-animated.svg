<svg class="s" data-state="idle" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sarathi"><style>
.s *{transform-box:fill-box;transform-origin:center}
svg[data-state="idle"] .body{animation:sway 5s ease-in-out infinite;transform-box:view-box;transform-origin:32px 60px}
svg[data-state="listening"] .ring1{animation:ripple 1.6s ease-out infinite}
svg[data-state="listening"] .eye{animation:open 1.6s ease-in-out infinite}
svg[data-state="thinking"] .barb{animation:run 1.2s ease-in-out infinite}
svg[data-state="thinking"] .barb:nth-of-type(3){animation-delay:.15s} svg[data-state="thinking"] .barb:nth-of-type(4){animation-delay:.3s}
svg[data-state="thinking"] .barb:nth-of-type(5){animation-delay:.45s} svg[data-state="thinking"] .barb:nth-of-type(6){animation-delay:.6s}
svg[data-state="thinking"] .barb:nth-of-type(7){animation-delay:.75s}
svg[data-state="answering"] .core{animation:glint 1.1s ease-in-out infinite}
svg[data-state="answering"] .body{animation:lift 1.1s ease-in-out infinite;transform-box:view-box;transform-origin:32px 60px}
@keyframes sway{0%,100%{transform:rotate(-2.5deg) scale(1)}50%{transform:rotate(2.5deg) scale(1.03)}}
@keyframes ripple{0%{transform:scale(.9);opacity:.95}100%{transform:scale(1.6);opacity:0}}
@keyframes open{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.1)}}
@keyframes run{0%,100%{opacity:.35}40%{opacity:1}}
@keyframes glint{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
@keyframes lift{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@media (prefers-reduced-motion:reduce){.s *{animation:none!important}}
</style><defs><linearGradient id="g-vane" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14C2B4"/><stop offset=".55" stop-color="#0FA39A"/><stop offset="1" stop-color="#2347B8"/></linearGradient><radialGradient id="g-eye" cx=".5" cy=".45" r=".6"><stop offset="0" stop-color="#2347B8"/><stop offset="1" stop-color="#14246B"/></radialGradient></defs><g class="body"><path d="M32 3 C51 17 55 34 47 46 C41 55 23 55 17 46 C9 34 13 17 32 3Z" fill="url(#g-vane)"/><path class="barb" d="M32 10 L22 24" stroke="#7FE3D8" stroke-width="1.6" stroke-linecap="round" opacity=".55"/><path class="barb" d="M32 10 L42 24" stroke="#7FE3D8" stroke-width="1.6" stroke-linecap="round" opacity=".55"/><path class="barb" d="M32 20 L19 34" stroke="#7FE3D8" stroke-width="1.6" stroke-linecap="round" opacity=".55"/><path class="barb" d="M32 20 L45 34" stroke="#7FE3D8" stroke-width="1.6" stroke-linecap="round" opacity=".55"/><path class="barb" d="M32 30 L18 44" stroke="#7FE3D8" stroke-width="1.6" stroke-linecap="round" opacity=".55"/><path class="barb" d="M32 30 L46 44" stroke="#7FE3D8" stroke-width="1.6" stroke-linecap="round" opacity=".55"/><ellipse class="ring1" cx="32" cy="38" rx="11.5" ry="12.5" fill="none" stroke="#E9B949" stroke-width="2.4" opacity=".9"/><ellipse class="eye" cx="32" cy="38" rx="9" ry="10" fill="url(#g-eye)"/><ellipse class="core" cx="32" cy="39" rx="4.4" ry="5" fill="#E9B949"/><path d="M32 52 L32 61" stroke="#0FA39A" stroke-width="3" stroke-linecap="round"/></g></svg>
